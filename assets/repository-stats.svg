<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="statBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.05" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:0.05" />
    </linearGradient>
    
    <linearGradient id="progGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    
    <filter id="statShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#statBg)"/>
  
  <!-- Title -->
  <text x="400" y="35" font-family="Arial, sans-serif" font-size="24" fill="#2c3e50" text-anchor="middle" font-weight="bold">📊 Repository at a Glance</text>
  
  <!-- Main Stats Grid -->
  
  <!-- Stat Card 1: Total Programs -->
  <g transform="translate(40, 70)">
    <rect width="220" height="120" rx="12" fill="white" stroke="#e1e8ed" stroke-width="2" filter="url(#statShadow)"/>
    <text x="110" y="35" font-family="Arial, sans-serif" font-size="42" fill="#667eea" text-anchor="middle" font-weight="bold">50+</text>
    <text x="110" y="60" font-family="Arial, sans-serif" font-size="14" fill="#7f8c8d" text-anchor="middle">Total Programs</text>
    <g transform="translate(60, 75)">
      <circle cx="0" cy="0" r="3" fill="#667eea" opacity="0.3"/>
      <circle cx="15" cy="0" r="3" fill="#667eea" opacity="0.3"/>
      <circle cx="30" cy="0" r="3" fill="#667eea" opacity="0.3"/>
      <circle cx="45" cy="0" r="3" fill="#667eea" opacity="0.3"/>
      <circle cx="60" cy="0" r="3" fill="#667eea" opacity="0.3"/>
      <circle cx="75" cy="0" r="3" fill="#667eea" opacity="0.3"/>
      <circle cx="90" cy="0" r="3" fill="#667eea" opacity="0.3"/>
    </g>
    <text x="110" y="105" font-family="Arial, sans-serif" font-size="11" fill="#95a5a6" text-anchor="middle" font-style="italic">Across 7 modules</text>
  </g>
  
  <!-- Stat Card 2: Code Lines -->
  <g transform="translate(280, 70)">
    <rect width="220" height="120" rx="12" fill="white" stroke="#e1e8ed" stroke-width="2" filter="url(#statShadow)"/>
    <text x="110" y="35" font-family="Arial, sans-serif" font-size="42" fill="#3498db" text-anchor="middle" font-weight="bold">3.5K+</text>
    <text x="110" y="60" font-family="Arial, sans-serif" font-size="14" fill="#7f8c8d" text-anchor="middle">Lines of Code</text>
    <g transform="translate(40, 70)" fill="#3498db" opacity="0.2">
      <rect x="0" y="0" width="130" height="4" rx="2"/>
      <rect x="0" y="10" width="100" height="4" rx="2"/>
      <rect x="0" y="20" width="120" height="4" rx="2"/>
    </g>
    <text x="110" y="105" font-family="Arial, sans-serif" font-size="11" fill="#95a5a6" text-anchor="middle" font-style="italic">Well-documented</text>
  </g>
  
  <!-- Stat Card 3: Pattern Programs -->
  <g transform="translate(520, 70)">
    <rect width="220" height="120" rx="12" fill="white" stroke="#e1e8ed" stroke-width="2" filter="url(#statShadow)"/>
    <text x="110" y="35" font-family="Arial, sans-serif" font-size="42" fill="#9b59b6" text-anchor="middle" font-weight="bold">17</text>
    <text x="110" y="60" font-family="Arial, sans-serif" font-size="14" fill="#7f8c8d" text-anchor="middle">Pattern Programs</text>
    <g transform="translate(70, 72)" fill="#9b59b6" opacity="0.3" font-family="monospace" font-size="14">
      <text x="0" y="0">*</text>
      <text x="-5" y="15">**</text>
      <text x="-10" y="30">***</text>
    </g>
    <text x="110" y="105" font-family="Arial, sans-serif" font-size="11" fill="#95a5a6" text-anchor="middle" font-style="italic">Stars, numbers, shapes</text>
  </g>
  
  <!-- Module Distribution Chart -->
  <g transform="translate(40, 220)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="16" fill="#2c3e50" font-weight="bold">Module Distribution</text>
    
    <!-- Progress bars for each module -->
    <!-- Basic -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="700" height="20" rx="10" fill="#ecf0f1"/>
      <rect x="0" y="0" width="80" height="20" rx="10" fill="#FF6B6B"/>
      <text x="90" y="15" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Basic (6 programs)</text>
    </g>
    
    <!-- Array -->
    <g transform="translate(0, 45)">
      <rect x="0" y="0" width="700" height="20" rx="10" fill="#ecf0f1"/>
      <rect x="0" y="0" width="110" height="20" rx="10" fill="#4ECDC4"/>
      <text x="120" y="15" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Array (8 programs)</text>
    </g>
    
    <!-- Function -->
    <g transform="translate(0, 70)">
      <rect x="0" y="0" width="700" height="20" rx="10" fill="#ecf0f1"/>
      <rect x="0" y="0" width="125" height="20" rx="10" fill="#A8E6CF"/>
      <text x="135" y="15" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Function (9 programs)</text>
    </g>
    
    <!-- Loops -->
    <g transform="translate(0, 95)">
      <rect x="0" y="0" width="700" height="20" rx="10" fill="#ecf0f1"/>
      <rect x="0" y="0" width="125" height="20" rx="10" fill="#FFD93D"/>
      <text x="135" y="15" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Loops (9 programs)</text>
    </g>
    
    <!-- Pattern -->
    <g transform="translate(0, 120)">
      <rect x="0" y="0" width="700" height="20" rx="10" fill="#ecf0f1"/>
      <rect x="0" y="0" width="230" height="20" rx="10" fill="#A29BFE"/>
      <text x="240" y="15" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Pattern (17 programs) — Most diverse!</text>
    </g>
    
    <!-- Recursion -->
    <g transform="translate(0, 145)">
      <rect x="0" y="0" width="700" height="20" rx="10" fill="#ecf0f1"/>
      <rect x="0" y="0" width="15" height="20" rx="10" fill="#FD79A8"/>
      <text x="25" y="15" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Recursion (1 program)</text>
    </g>
    
    <!-- String -->
    <g transform="translate(0, 170)">
      <rect x="0" y="0" width="700" height="20" rx="10" fill="#ecf0f1"/>
      <rect x="0" y="0" width="28" height="20" rx="10" fill="#74B9FF"/>
      <text x="38" y="15" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">String (2 programs)</text>
    </g>
  </g>
  
  <!-- Footer note -->
  <text x="400" y="385" font-family="Arial, sans-serif" font-size="11" fill="#95a5a6" text-anchor="middle" font-style="italic">⭐ Star this repo if you find it helpful!</text>
</svg>
